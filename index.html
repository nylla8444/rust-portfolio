<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{app_title}</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Allyn Ralf Ledesma (nylla), Computer Science student at West Visayas State University and part-time software developer at Robo Code Technologies Inc. Portfolio built with Rust and Dioxus."
    />
    <meta name="theme-color" content="#f8f2e6" />
    <meta name="author" content="Allyn Ralf Ledesma" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://nylla.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nylla.vercel.app/" />

    <meta
      property="og:description"
      content="CS student at West Visayas State University and part-time software developer at Robo Code Technologies Inc. Builds Rust tools like dioxus-vercel and viewtally."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@nylla8444" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz@6..72&display=swap"
    />
    <link rel="preload" href="/fonts/PaperMono.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Paper is the default look. Apply a saved "dark" choice before first
      // paint, so night mode never flashes paper.
      (function () {
        try {
          var dark = localStorage.getItem("theme") === "dark";
          document.documentElement.classList.toggle("dark", dark);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#0e0c09" : "#f8f2e6");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
