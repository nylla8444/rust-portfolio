[package]
name = "internship-portfolio"
version = "0.1.0"
edition = "2024"
description = "Personal portfolio built with Rust and Dioxus"
license = "MIT"

[package.metadata.dioxus-vercel]
project = "nylla"

[dependencies]
dioxus = { version = "=0.7.10" }
lucide-dioxus = { version = "3.63", features = ["all-icons"] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "DomTokenList",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "MouseEvent",
    "MediaQueryList",
    "Storage",
    "Window",
] }

[features]
default = ["web"]
web = ["dioxus/web"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
